<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Conexión Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1e293b; color: white; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #2563eb; }
        pre { background: #0f172a; padding: 15px; border-radius: 5px; border: 1px solid #334155; overflow-x: auto; color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>

    <h2>Prueba de Diagnóstico Supabase</h2>
    <button onclick="probarConexion()">1. Probar Conexión</button>
    <pre id="resultado">Esperando acción...</pre>

    <script>
        const SUPABASE_URL = 'https://wdbqhqykqogwalesqpp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_o23qFllIDQ4SfFanUftyTQ_Zh_py4yK';
        
        // CAMBIO APLICADO AQUÍ: Nombramos a la variable 'db' para no chocar con la librería
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function probarConexion() {
            const pantalla = document.getElementById('resultado');
            pantalla.className = "";
            pantalla.innerText = "⏳ Conectando...";

            try {
                // CAMBIO APLICADO AQUÍ: Usamos 'db' en lugar de 'supabase'
                const { data, error } = await db.from('Credenciales').select('*');

                if (error) {
                    pantalla.className = "error";
                    pantalla.innerText = "❌ ERROR: " + JSON.stringify(error, null, 2);
                } else {
                    pantalla.innerText = "✅ ¡ÉXITO! Datos:\n" + JSON.stringify(data, null, 2);
                }
            } catch (err) {
                pantalla.className = "error";
                pantalla.innerText = "❌ ERROR CRÍTICO: " + err.message;
            }
        }
    </script>
</body>
</html>
