<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio Catering - Admin</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0047AB">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Librería UMD de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <script>
        tailwind.config = { theme: { extend: { colors: { ejesa: { blue: '#0047AB', cyan: '#00B4D8', dark: '#0B132B' } }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
</head>
<body class="h-full flex flex-col font-sans antialiased text-slate-800">

    <div id="login-screen" class="fixed inset-0 bg-ejesa-dark z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-ejesa-blue text-white rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-lg"><i class="fa-solid fa-user-shield"></i></div>
                <h2 class="text-2xl font-bold text-slate-900">Portal Admin</h2>
                <p class="text-slate-500 text-sm">Base de Datos PostgreSQL (Supabase)</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-5">
                <input type="text" id="adminUser" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none" placeholder="Usuario">
                <input type="password" id="adminPass" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none" placeholder="Contraseña">
                <div id="loginError" class="hidden text-sm text-red-600 bg-red-50 p-3 rounded-lg text-center font-medium"></div>
                <button type="submit" id="btnLogin" class="w-full bg-ejesa-blue text-white font-bold py-3.5 rounded-xl shadow-lg transition">Ingresar</button>
            </form>
        </div>
    </div>

    <div id="dashboard-screen" class="hidden h-full flex-col">
        <header class="bg-white border-b px-4 py-3 flex justify-between items-center shadow-sm z-30">
            <div class="flex items-center gap-3"><div class="bg-ejesa-blue text-white font-bold px-3 py-1.5 rounded-lg">EJESA</div><h1 class="text-lg font-bold">Panel Admin</h1></div>
            <div class="flex items-center gap-3"><span id="header-user-name" class="text-sm font-medium text-slate-500"></span><button onclick="logout()" class="bg-red-50 text-red-600 text-sm px-3 py-2 rounded-lg font-medium">Salir</button></div>
        </header>

        <div class="flex flex-1 overflow-hidden">
            <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col shrink-0 p-4">
                <nav class="space-y-1">
                    <button onclick="switchView('personal')" id="nav-personal" class="w-full flex gap-3 items-center bg-ejesa-blue text-white px-4 py-3 rounded-xl font-medium"><i class="fa-solid fa-users w-5"></i> Personal</button>
                    <button onclick="switchView('visitas')" id="nav-visitas" class="w-full flex gap-3 items-center hover:bg-slate-800 text-slate-300 px-4 py-3 rounded-xl font-medium"><i class="fa-solid fa-handshake w-5"></i> Visitas</button>
                    <button onclick="switchView('masiva')" id="nav-masiva" class="w-full flex gap-3 items-center hover:bg-slate-800 text-slate-300 px-4 py-3 rounded-xl font-medium"><i class="fa-solid fa-bus w-5"></i> Lotes Masivos</button>
                    <button onclick="switchView('validaciones')" id="nav-validaciones" class="w-full flex justify-between items-center hover:bg-slate-800 text-slate-300 px-4 py-3 rounded-xl font-medium">
                        <div class="flex gap-3"><i class="fa-solid fa-check-double w-5"></i> Validaciones</div><span id="badge-val" class="hidden bg-blue-500 text-white text-[10px] px-2 rounded-full">0</span>
                    </button>
                    <button onclick="switchView('reportes')" id="nav-reportes" class="w-full flex gap-3 items-center hover:bg-slate-800 text-slate-300 px-4 py-3 rounded-xl font-medium"><i class="fa-solid fa-chart-pie w-5"></i> Reportes</button>
                </nav>
            </aside>

            <main class="flex-1 bg-slate-50 p-6 overflow-y-auto">
                <!-- VISTA PERSONAL -->
                <div id="view-personal" class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h2 class="text-2xl font-bold text-slate-800">Directorio de Personal</h2>
                        <button onclick="document.getElementById('modal-add').classList.remove('hidden')" class="bg-emerald-600 text-white font-semibold py-2 px-4 rounded-xl shadow-lg"><i class="fa-solid fa-plus"></i> Nuevo Empleado</button>
                    </div>
                    <div class="bg-white border rounded-2xl shadow-sm overflow-hidden">
                        <table class="w-full text-left border-collapse"><thead class="bg-slate-50 border-b"><tr><th class="p-4">PIN / DNI</th><th class="p-4">Nombre</th><th class="p-4">Empresa</th><th class="p-4">Estado</th><th class="p-4 text-center">Acciones</th></tr></thead><tbody id="employee-table-body" class="text-sm divide-y"></tbody></table>
                    </div>
                </div>

                <!-- VISTA VISITAS -->
                <div id="view-visitas" class="space-y-6 hidden">
                    <div class="flex justify-between items-center">
                        <h2 class="text-2xl font-bold text-slate-800">Directorio de Visitas</h2>
                    </div>
                    <div class="bg-white border rounded-2xl shadow-sm overflow-hidden">
                        <table class="w-full text-left border-collapse"><thead class="bg-slate-50 border-b"><tr><th class="p-4">Nombre</th><th class="p-4">Empresa</th><th class="p-4">Estado</th></tr></thead><tbody id="visitor-table-body" class="text-sm divide-y"></tbody></table>
                    </div>
                </div>

                <!-- VISTA CARGA MASIVA -->
                <div id="view-masiva" class="space-y-6 max-w-xl mx-auto hidden">
                    <div class="bg-white rounded-3xl shadow-xl border p-8 space-y-6">
                        <h2 class="text-xl font-bold text-slate-800">Carga Masiva Directa</h2>
                        <form onsubmit="ejecutarCargaMasiva(event)" class="space-y-4">
                            <input type="text" id="masiva-inst" required placeholder="Institución / Delegación" class="w-full px-4 py-3 border rounded-xl">
                            <div class="flex gap-4">
                                <input type="number" id="masiva-cant" required min="1" value="30" class="w-full px-4 py-3 border rounded-xl" title="Cantidad">
                                <select id="masiva-comida" class="w-full px-4 py-3 border rounded-xl"><option value="Almuerzo">Almuerzo</option><option value="Cena">Cena</option></select>
                            </div>
                            <button type="submit" class="w-full bg-ejesa-blue text-white font-bold py-3.5 rounded-xl">Generar Lote Masivo</button>
                        </form>
                    </div>
                </div>

                <!-- VISTA VALIDACIONES -->
                <div id="view-validaciones" class="space-y-6 hidden">
                    <h2 class="text-2xl font-bold text-slate-800">Auditoría Pendientes</h2>
                    <div class="bg-white border rounded-2xl shadow-sm overflow-hidden">
                        <table class="w-full text-left border-collapse"><thead class="bg-blue-50 border-b"><tr><th class="p-4">Fecha</th><th class="p-4">Persona</th><th class="p-4">Comida</th><th class="p-4 text-center">Acción</th></tr></thead><tbody id="pendientes-table-body" class="text-sm divide-y"></tbody></table>
                    </div>
                </div>

                <!-- VISTA REPORTES -->
                <div id="view-reportes" class="space-y-6 hidden">
                    <div class="flex gap-4 bg-white p-4 rounded-xl border">
