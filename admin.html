<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio Catering - Admin Supabase</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0047AB">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Librería Oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { ejesa: { blue: '#0047AB', cyan: '#00B4D8', dark: '#0B132B' } },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="h-full flex flex-col font-sans antialiased text-slate-800">

    <div id="login-screen" class="fixed inset-0 bg-ejesa-dark z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 max-w-md w-full">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-ejesa-blue text-white rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-lg">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-900">Portal Admin Supabase</h2>
                <p class="text-slate-500 text-sm">Gestión de Alta Velocidad</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Usuario</label>
                    <input type="text" id="adminUser" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-ejesa-blue outline-none" placeholder="admin o cocina">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Contraseña</label>
                    <input type="password" id="adminPass" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-ejesa-blue outline-none" placeholder="••••••••">
                </div>
                <div id="loginError" class="hidden text-sm text-red-600 bg-red-50 p-3 rounded-lg border border-red-200 text-center font-medium"></div>
                <button type="submit" id="btnLogin" class="w-full bg-ejesa-blue hover:bg-blue-800 text-white font-bold py-3.5 rounded-xl shadow-lg transition">Ingresar al Panel</button>
            </form>
            <div class="mt-6 pt-4 border-t border-slate-100 text-center space-y-1">
                <p class="text-xs font-bold text-slate-700">Fabian R. Martinez &bull; Soluciones Informáticas</p>
            </div>
        </div>
    </div>

    <div id="dashboard-screen" class="hidden h-full flex-col">
        <header class="bg-white border-b border-slate-200 px-4 py-3 flex justify-between items-center shrink-0 shadow-sm z-30">
            <div class="flex items-center gap-3">
                <div class="bg-ejesa-blue text-white font-bold px-3 py-1.5 rounded-lg text-lg tracking-wider shadow">EJESA</div>
                <h1 class="text-lg font-bold text-slate-800">Panel Administrativo</h1>
            </div>
            <div class="flex items-center gap-3">
                <span id="header-user-name" class="text-sm font-medium text-slate-500"></span>
                <button onclick="logout()" class="bg-red-50 hover:bg-red-100 text-red-600 text-sm px-3 py-2 rounded-lg font-medium transition">Salir</button>
            </div>
        </header>

        <div class="flex flex-1 overflow-hidden relative">
            <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col shrink-0 p-4">
                <nav class="space-y-1">
                    <button onclick="switchView('personal')" id="nav-personal" class="w-full text-left bg-ejesa-blue text-white px-4 py-3 rounded-xl font-medium">Personal Planta</button>
                    <button onclick="switchView('reportes')" id="nav-reportes" class="w-full text-left hover:bg-slate-800 text-slate-300 px-4 py-3 rounded-xl font-medium">Reportes y Estadísticas</button>
                </nav>
            </aside>

            <main class="flex-1 bg-slate-50 p-6 overflow-y-auto">
                <div id="view-personal" class="space-y-6">
                    <h2 class="text-2xl font-bold text-slate-800">Directorio de Personal</h2>
                    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 text-slate-500 text-xs uppercase border-b">
                                    <th class="p-4">PIN / DNI</th>
                                    <th class="p-4">Nombre y Apellido</th>
                                    <th class="p-4">Empresa</th>
                                    <th class="p-4">Estado</th>
                                </tr>
                            </thead>
                            <tbody id="employee-table-body" class="text-sm divide-y">
                                <tr><td colspan="4" class="p-6 text-center text-slate-400">Cargando desde Supabase...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="view-reportes" class="space-y-6 hidden">
                    <h2 class="text-2xl font-bold text-slate-800">Reportes de Consumo</h2>
                    <p class="text-slate-500 text-sm">Consultas en tiempo real conectadas a PostgreSQL.</p>
                </div>
            </main>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://wdbqhqykqogwalesqpp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_o23qFllIDQ4SfFanUftyTQ_Zh_py4yK';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let adminUser = null, userRole = 'admin';

        window.onload = function() {
            const u = sessionStorage.getItem('admin_user');
            if (u) { adminUser = u; showDashboard(); }
        };

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('adminUser').value.trim();
            const p = document.getElementById('adminPass').value.trim();
            const err = document.getElementById('loginError');

            const { data, error } = await supabase
                .from('Credenciales')
                .select('*')
                .eq('usuario', u)
                .eq('password', p)
                .single();

            if (error || !data) {
                err.innerText = 'Credenciales incorrectas.';
                err.classList.remove('hidden');
            } else {
                adminUser = data.descripcion;
                userRole = data.rol;
                sessionStorage.setItem('admin_user', adminUser);
                showDashboard();
            }
        }

        function showDashboard() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            document.getElementById('dashboard-screen').classList.add('flex');
            document.getElementById('header-user-name').innerText = adminUser;
            fetchEmployees();
        }

        async function fetchEmployees() {
            const { data, error } = await supabase.from('Personal').select('*');
            const tbody = document.getElementById('employee-table-body');
            tbody.innerHTML = '';
            if (error || !data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-slate-400">Sin registros en la base.</td></tr>`;
                return;
            }
            data.forEach(emp => {
                tbody.innerHTML += `
                    <tr class="border-b">
                        <td class="p-4 font-mono font-bold">${emp.dni}</td>
                        <td class="p-4 font-bold">${emp.nombre}</td>
                        <td class="p-4">${emp.empresa}</td>
                        <td class="p-4"><span class="px-2 py-1 rounded text-xs bg-emerald-100 text-emerald-700">${emp.estado}</span></td>
                    </tr>
                `;
            });
        }

        function switchView(v) {
            document.getElementById('view-personal').classList.toggle('hidden', v !== 'personal');
            document.getElementById('view-reportes').classList.toggle('hidden', v !== 'reportes');
        }

        function logout() {
            sessionStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
